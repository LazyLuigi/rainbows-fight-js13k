// move cycle is A, P, B, P where P (-1) is the passing frame built below
var A={idle:[0,1],move:[2,-1,3,-1],kick:[4],hurt:[5]};
function decode(q){
  var g=[],bin=atob(q),i=0,y;
  for(y=0;y<32;y++)g.push(new Array(32).fill(0));
  for(var m=0;m<bin.length;m++){var b=bin.charCodeAt(m),n=(b&15)+1,k=b>>4;
    for(var e=0;e<n;e++,i++)if(k)g[i>>5][i&31]=k}
  return g;
}
function toCanvas(g){
  var z=document.createElement('canvas'),x=z.getContext('2d');z.width=z.height=32;
  for(var y=0;y<32;y++)for(var xx=0;xx<32;xx++)if(g[y][xx]){x.fillStyle=P[g[y][xx]];x.fillRect(xx,y,1,1)}
  return z;
}
// Passing frame ("STACK"): below the hip, everything is pinched toward the
// centre with a taper so the stride closes and the legs overlap; the torso
// rises one pixel and the legs gain one row, straight legs being taller.
function passing(src,hip){
  var out=[],x,y,L=-1,R=-1,seen=0;
  for(x=0;x<32;x++){var v=src[30][x];if(v)seen=1;if(seen&&!v&&L<0)L=x-1;if(L>=0&&v){R=x;break}}
  var mid=(L+R)/2,k=Math.ceil((R-L-1)/2)+3;
  function row(r){var o=new Array(32).fill(0),s=Math.round(k*(r-hip)/(31-hip)),nx;
    for(x=0;x<32;x++)if(src[r][x]&&x<mid){nx=x+s;if(nx<32)o[nx]=src[r][x]}
    for(x=0;x<32;x++)if(src[r][x]&&x>=mid){nx=x-s;if(nx>=0)o[nx]=src[r][x]}
    return o}
  for(y=0;y<hip-1;y++)out[y]=src[y+1];
  out[hip-1]=row(hip);
  for(y=hip;y<32;y++)out[y]=row(y);
  return out;
}
var G=D.map(decode),S=G.map(toCanvas);
S.push(toCanvas(passing(G[2],20)),toCanvas(passing(G[8],21)));   // 12 unicorn P, 13 wolf P

// =====================================================================
// MUSIC: 4 NES-style voices scheduled on the audio clock, plus fight SFX
// Patterns: 16 chars per bar, '0'-'9','a'-'z' = semitones, '.' rest, '-' hold
// =====================================================================
var BPM=158,STEP=60/158/4;
var AC=null,master,gains=[],noiseBuf=null,musicOn=1;
var nextT=0,mstep=0,timer=0;
var BASS=["0.0.0-3.0.0-a.7.","0.0.0-3.0.0-a.c.","8.8.8-c.8.8-f.c.","a.a.a-e.a.a-h.e."];
var LEAD=["c-..a-c-f-c-a-7-","5-..7-a-7-5-3-0-","c---f-c-a---7-5-","7-a-e---c-------"];
var CHORD=[[0,3,7],[0,3,7],[8,12,15],[10,14,17]],DRUM="x.-.o.-.x.x-o.-o";
var BASE=[82.41,329.63,164.81];
function ensureAudio(){
  if(AC){if(AC.state==='suspended'){var p=AC.resume();if(p&&p['catch'])p['catch'](function(){})}return AC}
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor){audioState='AudioContext unavailable';return null}
  try{AC=new Ctor()}catch(e){audioState='blocked: '+e.message;return null}
  try{
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    for(var i=0;i<4;i++){gains[i]=AC.createGain();gains[i].connect(master)}
    var len=Math.floor(AC.sampleRate*.3);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    var d=noiseBuf.getChannelData(0);for(var j=0;j<len;j++)d[j]=Math.random()*2-1;
  }catch(e){audioState='graph failed: '+e.message;AC=null;return null}
  if(AC.state==='suspended'){var pr=AC.resume();if(pr&&pr['catch'])pr['catch'](function(){})}
  audioState='ready '+AC.sampleRate+' Hz';return AC;
}
function noteOf(ch){return ch>='a'?ch.charCodeAt(0)-87:ch.charCodeAt(0)-48}
function holdLen(pat,i){var n=1;while(n<16&&pat.charAt((i+n)%16)==='-')n++;return n}
function tone(ch,f,t,dur,type,vol,det){
  if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(g);g.connect(gains[ch]);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
function sweep(f0,f1,t,dur,type,vol){
  if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  o.connect(g);g.connect(gains[1]);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
function noiseHit(t,dur,vol,hp){
  if(!AC||!noiseBuf)return;var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type=hp?'highpass':'bandpass';f.frequency.value=hp?7000:1800;f.Q.value=.8;
  s.connect(f);f.connect(g);g.connect(gains[3]);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.start(t);s.stop(t+dur+.02);
}
function kickDrum(t){
  if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.11);
  o.connect(g);g.connect(gains[3]);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
  o.start(t);o.stop(t+.16);
}
function sfxSwing(){if(AC)noiseHit(AC.currentTime,.05,.16,1)}
function sfxHit(){if(!AC)return;var t=AC.currentTime;noiseHit(t,.09,.5);kickDrum(t);sweep(700,180,t,.09,'square',.18)}
function sfxWhiff(){if(AC)tone(1,140,AC.currentTime,.06,'square',.08)}
function sfxHurt(){if(!AC)return;var t=AC.currentTime;noiseHit(t,.28,.55);sweep(320,60,t,.3,'square',.28)}
function playStep(i,t){
  if(!musicOn)return;
  var bar=(i>>4)%4,b=i&15,ch,n,d,f;
  ch=BASS[bar].charAt(b);
  if(ch!=='.'&&ch!=='-'){n=noteOf(ch);d=holdLen(BASS[bar],b)*STEP;
    tone(0,BASE[0]*Math.pow(2,n/12),t,d*.95,'triangle',.5);
    tone(0,BASE[0]*2*Math.pow(2,n/12),t,d*.4,'square',.05)}
  ch=LEAD[bar].charAt(b);
  if(ch!=='.'&&ch!=='-'){n=noteOf(ch);d=holdLen(LEAD[bar],b)*STEP;f=BASE[1]*Math.pow(2,n/12);
    tone(1,f,t,d*.9,'square',.08,-6);tone(1,f,t,d*.9,'square',.08,6)}
  var c=CHORD[bar];tone(2,BASE[2]*Math.pow(2,c[b%3]/12),t,STEP*.9,'square',.035);
  ch=DRUM.charAt(b);
  if(ch==='x')kickDrum(t);
  if(ch==='o'){noiseHit(t,.12,.42);kickDrum(t)}
  if(ch==='-')noiseHit(t,.03,.14,1);
}
var tick=guard('tick',function(){
  if(!running||!AC)return;
  var ahead=AC.currentTime+.2,n=0;
  while(nextT<ahead&&n<64){playStep(mstep,nextT);nextT+=STEP;mstep++;n++}
});

// like Double Dragon: x is travel, y is how far up or down the pavement.
// =====================================================================
var SCR=320, Y0=124, Y1=172;            // depth band for feet
var running=0,started=0,over=0,arena=0,camX=0,phase='fight',shake=0,scoreV=0,combo=0,comboT=0;
var mobs=[],fx=[],lives=3,flash=0;
var pl={x:60,y:150,vx:0,vy:0,face:1,a:'idle',t:0,atk:0,atkHit:0,hurt:0,inv:0,hp:3};

function now(){return AC?AC.currentTime:performance.now()/1000}
function arenaX0(){return arena*SCR}
function rnd(a,b){return a+Math.random()*(b-a)}

function spawnWave(){
  mobs=[];
  var n=2+Math.min(2,arena);
  for(var i=0;i<n;i++){
    var fromLeft=(i%2===0)?(Math.random()<.5):(Math.random()<.5);
    var x=fromLeft?camX-30-i*26:camX+SCR+30+i*26;
    mobs.push({x:x,y:rnd(Y0+4,Y1-4),face:fromLeft?1:-1,a:'move',t:i*80,
               hp:2,st:'walk',stT:0,kb:0,dead:0,deadT:0,wait:rnd(.1,.9)});
  }
}
function reset(){
  arena=0;camX=0;phase='fight';over=0;scoreV=0;combo=0;lives=3;fx=[];
  pl.x=60;pl.y=150;pl.vx=pl.vy=0;pl.face=1;pl.a='idle';pl.t=0;pl.atk=0;pl.hurt=0;pl.inv=0;
  spawnWave();
}
function boom(x,y,txt,col){fx.push({x:x,y:y,txt:txt,col:col,t:now()})}

// =====================================================================
// COMBAT
// Contact only: the player's swing and the wolf's bite both need the
// other body inside a small box, so nothing lands from across the road.
// =====================================================================
var REACH=30, DEPTH=12, BITE=24;

function attack(){
  if(!running||over||pl.atk>0||pl.hurt>0)return;
  pl.atk=.26;pl.atkHit=0;pl.a='kick';pl.t=0;
  sfxSwing();
}
function resolveAttack(){
  var hit=0;
  for(var i=0;i<mobs.length;i++){var m=mobs[i];
    if(m.dead)continue;
    var dx=(m.x-pl.x)*pl.face, dy=Math.abs(m.y-pl.y);
    if(dx>-6&&dx<REACH&&dy<DEPTH){
      m.hp--;m.st='hurt';m.stT=.32;m.a='hurt';m.t=0;m.kb=pl.face*130;
      hit=1;combo++;comboT=now()+1.6;
      scoreV+=100+combo*10;
      boom(m.x,m.y-58,combo>2?('x'+combo):'POW','#ffda23');
      shake=Math.max(shake,4);sfxHit();
      if(m.hp<=0){m.dead=1;m.deadT=now();scoreV+=200;boom(m.x,m.y-66,'KO','#f023aa')}
    }
  }
  if(!hit)sfxWhiff();
}
function hurtPlayer(from){
  if(pl.inv>0||over)return;
  lives--;combo=0;pl.hurt=.42;pl.inv=1.1;pl.a='hurt';pl.t=0;
  pl.x+=from*-14;shake=8;flash=1;sfxHurt();
  if(lives<=0){over=1;boom(pl.x,pl.y-70,'DOWN','#ee2323')}
}

// =====================================================================
// UPDATE
// =====================================================================
var moveX=0,moveY=0;
function update(dt){
  var t=now();
  if(comboT&&t>comboT){combo=0;comboT=0}
  // ---- player -------------------------------------------------------
  if(pl.hurt>0){pl.hurt-=dt}
  if(pl.inv>0){pl.inv-=dt}
  if(pl.atk>0){
    pl.atk-=dt;
    if(!pl.atkHit&&pl.atk<.19){pl.atkHit=1;resolveAttack()}
    if(pl.atk<=0){pl.atk=0;pl.a='idle'}
  }
  var busy=(pl.atk>0||pl.hurt>0);
  if(!busy&&!over){
    var sp=78;
    pl.x+=moveX*sp*dt;pl.y+=moveY*sp*.62*dt;
    if(moveX)pl.face=moveX>0?1:-1;
    pl.a=(moveX||moveY)?'move':'idle';
  }
  if(pl.y<Y0)pl.y=Y0;if(pl.y>Y1)pl.y=Y1;
  var left=camX+16,right=(phase==='fight')?camX+SCR-16:camX+SCR*2;
  if(pl.x<left)pl.x=left;if(pl.x>right)pl.x=right;
  pl.t+=dt*1000;

  // ---- wolves -------------------------------------------------------
  var alive=0;
  for(var i=0;i<mobs.length;i++){
    var m=mobs[i];
    if(m.dead){
      m.x+=m.kb*dt;m.kb*=.9;m.t+=dt*1000;
      continue;
    }
    alive++;
    m.t+=dt*1000;
    m.stT-=dt;
    if(m.kb){m.x+=m.kb*dt;m.kb*=.86;if(Math.abs(m.kb)<4)m.kb=0}
    var dx=pl.x-m.x, dy=pl.y-m.y, ax=Math.abs(dx);
    if(m.st==='hurt'){ if(m.stT<=0){m.st='walk';m.a='move'} }
    else if(m.st==='wind'){
      m.a='kick';
      if(m.stT<=0){
        // the bite only lands if the player is still in contact range
        if(Math.abs(pl.x-m.x)<BITE&&Math.abs(pl.y-m.y)<DEPTH)hurtPlayer(m.face);
        m.st='cool';m.stT=.55;m.a='idle';
      }
    }
    else if(m.st==='cool'){ if(m.stT<=0){m.st='walk';m.a='move'} }
    else {                                   // walk
      m.wait-=dt;
      if(m.face!==(dx>0?1:-1)&&ax>6)m.face=dx>0?1:-1;
      var close=(ax<BITE-4&&Math.abs(dy)<DEPTH-2);
      if(close&&m.wait<=0){m.st='wind';m.stT=.34;m.a='kick';m.t=0;boom(m.x,m.y-62,'!','#ee2323')}
      else{
        var sp2=(m.wait>0?26:40);
        var tx=pl.x-m.face*(BITE-8);
        m.x+=Math.sign(tx-m.x)*sp2*dt;
        m.y+=Math.sign(dy)*Math.min(Math.abs(dy),sp2*.55*dt);
        m.a='move';
      }
    }
    if(m.y<Y0)m.y=Y0;if(m.y>Y1)m.y=Y1;
    // wolves do not stack on the same spot
    for(var j=0;j<mobs.length;j++){if(j===i)continue;var o=mobs[j];if(o.dead)continue;
      if(Math.abs(o.x-m.x)<16&&Math.abs(o.y-m.y)<8){m.x+=(m.x<o.x?-1:1)*18*dt}}
  }
  for(var k=mobs.length-1;k>=0;k--)if(mobs[k].dead&&now()-mobs[k].deadT>1.1)mobs.splice(k,1);

  // ---- arena flow ---------------------------------------------------
  if(phase==='fight'&&alive===0&&!over)phase='clear';
  if(phase==='clear'){
    var want=pl.x-SCR/2;
    if(want>camX){camX=Math.min(want,(arena+1)*SCR);}
    if(camX>=(arena+1)*SCR-.5){camX=(arena+1)*SCR;arena++;phase='fight';spawnWave()}
  }
  if(shake>0){shake*=Math.pow(.02,dt);if(shake<.3)shake=0}
  if(flash>0){flash-=dt*3;if(flash<0)flash=0}
}

// =====================================================================
// INPUT: keyboard, plus a virtual stick on the left and a pad on the right
// =====================================================================
var keys={},stick={id:-1,ox:0,oy:0,x:0,y:0,on:0},padId=-1;
function recalcMove(){
  var kx=(keys.right?1:0)-(keys.left?1:0), ky=(keys.down?1:0)-(keys.up?1:0);
  if(stick.on){
    var dx=stick.x-stick.ox, dy=stick.y-stick.oy, d=Math.hypot(dx,dy);
    if(d>5){var f=Math.min(1,d/26);kx=dx/d*f;ky=dy/d*f}else{kx=0;ky=0}
  }
  moveX=kx;moveY=ky;
}
document.addEventListener('keydown',guard('key',function(e){
  var k=(e.key||'').toLowerCase();
  if(k===' '||k==='j'||k==='k'||k==='x'){e.preventDefault();
    if(!started||over){startGame()}else{attack()} return}
  if(k==='m'){musicOn^=1;ui();return}
  if(k==='r'){startGame();return}
  if(k==='arrowleft'||k==='a')keys.left=1;
  if(k==='arrowright'||k==='d')keys.right=1;
  if(k==='arrowup'||k==='w')keys.up=1;
  if(k==='arrowdown'||k==='s')keys.down=1;
  if(k.indexOf('arrow')===0)e.preventDefault();
  recalcMove();
}));
document.addEventListener('keyup',guard('keyup',function(e){
  var k=(e.key||'').toLowerCase();
  if(k==='arrowleft'||k==='a')keys.left=0;
  if(k==='arrowright'||k==='d')keys.right=0;
  if(k==='arrowup'||k==='w')keys.up=0;
  if(k==='arrowdown'||k==='s')keys.down=0;
  recalcMove();
}));
function cpos(e){var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*320/r.width,y:(e.clientY-r.top)*180/r.height}}
cv.addEventListener('pointerdown',guard('pd',function(e){
  e.preventDefault();if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId)}catch(_){}
  var p=cpos(e);
  if(!started||over){startGame();return}
  if(p.x<160){stick.id=e.pointerId;stick.ox=p.x;stick.oy=p.y;stick.x=p.x;stick.y=p.y;stick.on=1;recalcMove()}
  else{padId=e.pointerId;attack()}
}));
cv.addEventListener('pointermove',guard('pm',function(e){
  if(e.pointerId!==stick.id)return;
  var p=cpos(e);stick.x=p.x;stick.y=p.y;recalcMove();
}));
function endPointer(e){
  if(e.pointerId===stick.id){stick.on=0;stick.id=-1;recalcMove()}
  if(e.pointerId===padId)padId=-1;
}
cv.addEventListener('pointerup',guard('pu',endPointer));
cv.addEventListener('pointercancel',guard('pc',endPointer));

$('go').onclick=guard('go',function(){running?stopGame():startGame()});
$('mus').onclick=guard('mus',function(){musicOn^=1;ui()});
function ui(){
  $('go').className=running?'on':'';$('go').textContent=(running?'STOP':'START')+' [SPACE]';
  $('mus').className=musicOn?'on':'';
}
function startGame(){
  ensureAudio();reset();running=1;started=1;
  mstep=0;if(AC){nextT=AC.currentTime+.1;clearInterval(timer);timer=setInterval(tick,40)}
  ui();
}
function stopGame(){running=0;clearInterval(timer);ui()}

// =====================================================================
// SCENE
// =====================================================================
function h(n){var x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function layer(off,spacing,y0,hmin,hmax,c1,c2,lit){
  var first=Math.floor(off/spacing)-1;
  for(var i=first;i<first+(320/spacing)+3;i++){
    var x=Math.round(i*spacing-off),w=spacing-2+Math.floor(h(i*3.7)*6),
        hh=hmin+Math.floor(h(i)*(hmax-hmin)),y=y0-hh;
    C.fillStyle=(i&1)?c1:c2;C.fillRect(x,y,w,hh);
    if(lit){
      // Windows are addressed by their cell inside the building, never by the
      // scrolled screen position, so the pattern stays welded to the facade.
      var cols=Math.floor((w-6)/9),rows=Math.floor((hh-8)/10);
      for(var r=0;r<rows;r++)for(var q=0;q<cols;q++){
        var v=h(i*31.7+r*7.3+q*3.1);
        if(v<.3)continue;                       // dark flat
        C.fillStyle=v>.74?'#15cbed':'#ffb51b';
        C.fillRect(x+4+q*9,y+6+r*10,3,4);
      }
    }
  }
}
function drawScene(){
  C.fillStyle='#03030a';C.fillRect(0,0,320,180);
  C.fillStyle='#22133b';C.fillRect(0,54,320,126);
  C.fillStyle='#f3cc62';C.beginPath();C.arc(((-camX*.03)%440+440)%440-60,40,15,0,6.283);C.fill();
  layer(camX*.2,46,80,26,54,'#0b1030','#0d1338',0);
  layer(camX*.5,38,104,34,72,'#07122c','#09163a',1);
  C.fillStyle='#141426';C.fillRect(0,104,320,76);
  C.fillStyle='#1e1e36';C.fillRect(0,104,320,3);
  C.fillStyle='#101024';C.fillRect(0,Y0-4,320,3);          // kerb, back of the walkable band
  C.fillStyle='#26264a';
  var so=camX%26;
  for(var i=-1;i<15;i++)C.fillRect(Math.round(i*26-so),Y1+2,13,2);
  C.fillStyle='#191930';
  for(var y=118;y<180;y+=16)C.fillRect(0,y,320,1);
  var lo=camX*.9%118;
  for(var j=-1;j<4;j++){var lx=Math.round(j*118-lo);
    C.fillStyle='#2a2a3e';C.fillRect(lx,62,3,44);
    C.fillStyle='#ffda23';C.fillRect(lx-3,58,9,5);
    C.globalAlpha=.09;C.fillStyle='#ffda23';C.fillRect(lx-15,62,33,46);C.globalAlpha=1}
}
function shadow(x,y){C.globalAlpha=.32;C.fillStyle='#000';C.beginPath();
  C.ellipse(x-camX,y-1,13,4,0,0,6.283);C.fill();C.globalAlpha=1}
function spr(i,x,y,flip){
  var sc=2,sx=Math.round(x-camX-32),sy=Math.round(y-64);
  C.save();C.translate(sx,sy);
  if(flip){C.translate(64,0);C.scale(-1,1)}
  C.drawImage(S[i],0,0,64,64);C.restore();
}
function frameOf(o,base){
  var q=A[o.a],idx=q[Math.floor(o.t/(o.a==='move'?200:190))%q.length];
  return idx<0?12+(base?1:0):idx+base;
}

// =====================================================================
// DRAW
// =====================================================================
var lastTs=0;
var draw=guard('draw',function(ts){
  frames++;
  var dt=lastTs?Math.min(.05,(ts-lastTs)/1000):.016;lastTs=ts;
  if(running&&!over)update(dt);else if(over)update(Math.min(dt,.02));
  var t=now();

  C.save();
  if(shake>0)C.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawScene();

  // everything on the street sorted back to front
  var ents=[];
  for(var i=0;i<mobs.length;i++)ents.push(mobs[i]);
  ents.push(pl);
  ents.sort(function(a,b){return a.y-b.y});
  for(var e=0;e<ents.length;e++){
    var o=ents[e],isPl=(o===pl);
    shadow(o.x,o.y);
    if(o.dead){
      var age=t-o.deadT;C.globalAlpha=Math.max(0,1-age/1.1);
      spr(11,o.x,o.y+age*10,o.face>0);C.globalAlpha=1;continue;
    }
    if(isPl&&pl.inv>0&&Math.floor(t*20)%2)continue;       // blink while invulnerable
    // unicorn art faces right, wolf art faces left, so the flip differs
    var flip=isPl?(o.face<0):(o.face>0);
    if(!isPl&&o.st==='wind'&&Math.floor(t*24)%2){          // telegraph the bite
      C.globalAlpha=.75;spr(frameOf(o,6),o.x,o.y,flip);C.globalAlpha=1;
    }else{
      spr(frameOf(o,isPl?0:6),o.x,o.y,flip);
    }
  }
  // floaters
  for(var f=fx.length-1;f>=0;f--){var o2=fx[f],age2=t-o2.t;
    if(age2>.7){fx.splice(f,1);continue}
    C.globalAlpha=1-age2/.7;C.fillStyle=o2.col;C.font='8px monospace';
    C.fillText(o2.txt,o2.x-camX-8,o2.y-age2*16);C.globalAlpha=1}
  C.restore();

  // exit arrow once the screen is clear
  if(phase==='clear'&&!over&&Math.floor(t*3)%2){
    C.fillStyle='#ffda23';C.font='8px monospace';C.fillText('GO',292,96);
    for(var a=0;a<3;a++){var ax=294+a*7;
      C.beginPath();C.moveTo(ax,104);C.lineTo(ax+5,109);C.lineTo(ax,114);C.closePath();C.fill()}
  }

  // HUD
  C.fillStyle='#071018';C.fillRect(0,0,320,25);
  C.font='8px monospace';
  C.fillStyle='#f0e93b';C.fillText('SCORE '+scoreV,7,10);
  C.fillStyle='#0ff';C.fillText('STREET '+(arena+1),120,10);
  C.fillStyle='#f45';C.fillText(phase==='clear'?'CLEAR':'ENEMIES '+mobs.filter(function(m){return !m.dead}).length,225,10);
  for(var l=0;l<3;l++){C.fillStyle=(l<lives)?'#f023aa':'#332244';C.fillRect(7+l*12,15,9,7)}
  if(combo>1){C.fillStyle='#ffda23';C.fillText('COMBO '+combo,120,21)}

  // touch controls
  if(stick.on){
    C.globalAlpha=.35;C.strokeStyle='#0ff';C.lineWidth=2;
    C.beginPath();C.arc(stick.ox,stick.oy,26,0,6.283);C.stroke();
    var dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy)||1,f2=Math.min(1,26/d);
    C.fillStyle='#0ff';C.beginPath();C.arc(stick.ox+dx*f2,stick.oy+dy*f2,9,0,6.283);C.fill();
    C.globalAlpha=1;
  }
  C.globalAlpha=padId>=0?.5:.22;C.fillStyle='#f023aa';
  C.beginPath();C.arc(288,150,20,0,6.283);C.fill();
  C.globalAlpha=.8;C.fillStyle='#fff';C.fillText('HIT',281,153);C.globalAlpha=1;

  if(flash>0){C.globalAlpha=flash*.5;C.fillStyle='#ee2323';C.fillRect(0,25,320,155);C.globalAlpha=1}

  if(!started){
    C.fillStyle='rgba(0,0,0,.72)';C.fillRect(36,52,248,70);
    C.fillStyle='#0ff';C.fillText('RAINBOW FIGHT',112,70);
    C.fillStyle='#fff';C.fillText('CLEAR THE STREET, THEN WALK RIGHT',54,86);
    C.fillStyle='#ffda23';C.fillText('SPACE OR TAP TO START',96,104);
  }
  if(over){
    C.fillStyle='rgba(0,0,0,.75)';C.fillRect(40,58,240,62);
    C.fillStyle='#ee2323';C.fillText('GAME OVER',126,78);
    C.fillStyle='#fff';C.fillText('SCORE '+scoreV+'  STREET '+(arena+1),100,92);
    C.fillStyle='#ffda23';C.fillText('R OR TAP TO RETRY',102,108);
  }
  C.globalAlpha=.08;C.fillStyle='#fff';
  for(var yy=0;yy<180;yy+=2)C.fillRect(0,yy,320,1);
  C.globalAlpha=1;

  st.textContent=over?'game over':(running?('lives '+lives+' / street '+(arena+1)):'press START');
  if(frames%20===0)DIAG.textContent='engine OK, frames '+frames+', audio: '+audioState+', mobs '+mobs.length+(diagLines.length?'\n'+diagLines.join('\n'):'');
  requestAnimationFrame(draw);
});
ui();requestAnimationFrame(draw);
</script>
